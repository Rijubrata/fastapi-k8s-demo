apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi
      version: blue

  template:
    metadata:
      labels:
        app: fastapi
        version: blue

    spec:
      containers:
        - name: fastapi
          image: fastapik8sdemo.azurecr.io/fastapi-k8s-demo:v2

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"