name: Blue-Green Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: fastapik8sdemo.azurecr.io
  IMAGE_NAME: fastapi-k8s-demo

jobs:
  blue-green-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # 3. Login to ACR
      - name: Login to ACR
        run: |
          az acr login --name fastapik8sdemo


      # 4. Build image
      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            .


      # 5. Push image
      - name: Push image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}


      # 6. Configure kubectl
      - name: Configure kubectl
        env:
          AKS_CA: ${{ secrets.AKS_CA }}
          AKS_SERVER: ${{ secrets.AKS_SERVER }}
          AKS_TOKEN: ${{ secrets.AKS_TOKEN }}
        run: |
          printf '%s' "$AKS_CA" | tr -d '\r\n ' | base64 -d > /tmp/aks-ca.crt

          kubectl config set-cluster fastapi-aks \
            --server="$AKS_SERVER" \
            --certificate-authority=/tmp/aks-ca.crt \
            --embed-certs=true

          kubectl config set-credentials github-actions \
            --token="$AKS_TOKEN"

          kubectl config set-context fastapi-aks \
            --cluster=fastapi-aks \
            --user=github-actions \
            --namespace=default

          kubectl config use-context fastapi-aks


      # 7. Determine active and inactive environment
      - name: Determine deployment target
        id: target
        run: |
          ACTIVE=$(kubectl get service fastapi-service \
            -o jsonpath='{.spec.selector.version}')

          if [ "$ACTIVE" = "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi

          echo "Active environment: $ACTIVE"
          echo "Target environment: $TARGET"

          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"


      # 8. Deploy new version to inactive environment
      - name: Deploy inactive environment
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          kubectl set image deployment/fastapi-$TARGET \
            fastapi=$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}


      # 9. Wait for rollout
      - name: Verify rollout
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          kubectl rollout status \
            deployment/fastapi-$TARGET \
            --timeout=180s


      # 10. Switch traffic
      - name: Switch traffic
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          kubectl patch service fastapi-service \
            -p "{\"spec\":{\"selector\":{\"app\":\"fastapi\",\"version\":\"$TARGET\"}}}"


      # 11. Verify Service
      - name: Verify traffic switch
        run: |
          kubectl get service fastapi-service
          kubectl get endpoints fastapi-service